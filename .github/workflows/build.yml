name: Build Flutter APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Fix package name and create Android boilerplate
        run: |
          # Sửa tên trong pubspec.yaml từ ed-pro thành ed_pro nếu có
          if grep -q "name:\s*ed-pro" pubspec.yaml; then
            sed -i 's/name:\s*ed-pro/name: ed_pro/g' pubspec.yaml
          fi
          
          if [ ! -d "android" ]; then
            flutter create . --platforms=android --org com.edpro.app
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          
